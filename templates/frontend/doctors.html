{% extends "frontend/base.html" %}
{% load static %}



{% block title %}
    <title>Biotrexa | Doctors</title>
{% endblock title %}
    


{% block content %}
    <!-- Page Header Start -->
	<div class="page-header blog-page-header bg-radius-section parallaxie">
		<div class="container">
			<div class="row align-items-center">
				<div class="col-lg-12">
					<!-- Page Header Box Start -->
					<div class="page-header-box">
						<h1 class="text-anime-style-2" data-cursor="-opaque">Our Doctors</h1>
						<nav class="wow fadeInUp">
							<ol class="breadcrumb">
								<li class="breadcrumb-item"><a href="#">home</a></li>
								<li class="breadcrumb-item active" aria-current="page"> / doctors</li>
							</ol>
						</nav>
					</div>
					<!-- Page Header Box End -->
				</div>
			</div>
		</div>
	</div>
	<!-- Page Header End -->


    <!-- Page Team Start -->
    <div class="page-team bg-radius-section">
        <div class="container">
            <div class="row">
                
                {% for x in doctors %}                    
                    <div class="col-lg-3 col-md-6">
                        <!-- Team Member Item Start -->
                        <div class="team-member-item wow fadeInUp">
                            <!-- Team Image Start -->
                            <div class="team-image">
                                <figure class="image-anime">
                                    <img src="{{x.photo.url}}" alt="">
                                </figure>
                    
                                <!-- Team Social Icon Start -->
                                <div class="team-social-icon">
                                    <div class="header-btn d-inline-flex">
                                        <a href="{% url 'frontend_doctor' x.slug %}" class="btn-default doctor"><span>Book Appointment</span></a>
                                    </div>
                                </div>
                                <!-- Team Social Icon End -->
                            </div>
                            <!-- Team Image End -->
                    
                            <!-- Team Content Start -->
                            <div class="team-content">
                                <h3>dr. {{x.name}}</h3>
                                <p>{{x.designation}}</p>
                            </div>
                            <!-- Team Content End -->
                        </div>
                        <!-- Team Member Item End -->
                    </div>
                {% endfor %}
                    

                
            </div>
        </div>
    </div>
    <!-- Page Team End -->
{% endblock content %}
