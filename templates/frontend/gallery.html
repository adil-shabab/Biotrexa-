{% extends "frontend/base.html" %}
{% load static %}

{% block title %}
    <title>Biotrexa | Gallery</title>
{% endblock title %}

{% block content %}
    <!-- Page Header Start -->
	<div class="page-header blog-page-header bg-radius-section parallaxie">
		<div class="container">
			<div class="row align-items-center">
				<div class="col-lg-12">
					<!-- Page Header Box Start -->
					<div class="page-header-box">
						<h1 class="text-anime-style-2" data-cursor="-opaque">Our Gallery</h1>
						<nav class="wow fadeInUp">
							<ol class="breadcrumb">
								<li class="breadcrumb-item"><a href="#">home</a></li>
								<li class="breadcrumb-item active" aria-current="page"> / gallery</li>
							</ol>
						</nav>
					</div>
					<!-- Page Header Box End -->
				</div>
			</div>
		</div>
	</div>
	<!-- Page Header End -->
    <!-- Page Video Gallery Start -->
    <div class="page-video-gallery bg-radius-section">
        <div class="container">
            <div class="row">
                {% for x in gallery %}
                <div class="col-lg-4 col-md-6 col-6 mb-3">
                    <!-- image gallery start -->
                    <figure>
                        <img src="{{x.image.url}}" alt="">
                    </figure>
                    <!-- image gallery end -->
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
    <!-- Page Video Gallery End -->
{% endblock content %}
